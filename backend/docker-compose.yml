services:
  app:
    build: .
    ports:
      - "8000:8000"
    # 从 .env 注入应用所需的全部配置（SECRET_KEY、ENCRYPTION_KEY、AGENT_* 等）
    env_file:
      - .env
    environment:
      # 容器内通过服务名访问，覆盖 .env 中的本地地址（environment 优先级高于 env_file）
      - DATABASE_URL=postgresql+asyncpg://postgres:123456@db:5432/fastapi_rbac
      - REDIS_URL=redis://redis:6379/0
    # 启动前先执行数据库迁移，再拉起服务
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: fastapi_rbac
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
